[package]
name = "homemusic-native"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
async-channel = "2"
gstreamer = "0.25"
material-colors = { version = "0.5.0", features = ["quantize"] }
roxmltree = "0.21.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 0
strip = true
